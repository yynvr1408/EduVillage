# Self-hosted LanternEd for a single institution: one domain, one `docker compose up -d`.
# Postgres + the API/worker + the built frontend, all behind Caddy for automatic HTTPS.
#
# This is the SAME codebase as the centrally-hosted version — nothing here is a fork or a
# reduced edition. It exists for institutions that want to keep their own data (videos,
# materials, submissions) on their own infrastructure instead of the centrally-hosted service.
# See docs/SELF_HOSTING.md before running this.
#
# Usage:
#   cd deploy/self-hosted
#   cp .env.example .env   # fill in real values
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lanterned
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lanterned
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanterned"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../../backend
    env_file: .env
    environment:
      APP_ENV: production
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg2://lanterned:${POSTGRES_PASSWORD}@db:5432/lanterned
      FRONTEND_ORIGIN: https://${DOMAIN}
      SESSION_COOKIE_SAMESITE: lax # frontend and API share one domain behind Caddy, unlike the split Vercel/Render setup
      STORAGE_BACKEND: local # writes to the `media` volume below; see docs/SELF_HOSTING.md to use an S3-compatible bucket instead
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped

  worker:
    build:
      context: ../../backend
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://lanterned:${POSTGRES_PASSWORD}@db:5432/lanterned
      STORAGE_BACKEND: local
    depends_on:
      api:
        condition: service_started
    volumes:
      - media:/app/media
    command: python -m app.worker
    restart: unless-stopped

  frontend-build:
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: https://${DOMAIN}
    volumes:
      - frontend_dist:/out
    restart: "no"

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  media:
  frontend_dist:
  caddy_data:
  caddy_config:
