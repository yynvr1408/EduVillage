name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch/PR cancels the still-running check for the first — no point
# finishing a CI run for a commit that's already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      # ffmpeg is what the deployed Docker image bundles too (see backend/Dockerfile) — installing
      # it here means the transcription-pipeline tests run for real in CI, not just everywhere else.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Alembic migration chain has exactly one head
        run: |
          HEADS=$(alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $HEADS — a merge migration is needed."
            alembic heads
            exit 1
          fi

      # Reports known vulnerabilities in dependencies without failing the build — this is the
      # first time this project has had any scanning at all, so start as a visible signal rather
      # than an immediate hard gate on a baseline nobody has triaged yet. Tighten to a failing
      # check once the existing findings (if any) have been reviewed.
      - name: Dependency vulnerability scan (non-blocking)
        run: pip install pip-audit && pip-audit -r requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Dependency vulnerability scan (non-blocking)
        run: npm audit --audit-level=high || true
