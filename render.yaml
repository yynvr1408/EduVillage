services:
  - type: web
    name: eduvillage-api
    runtime: docker
    # No rootDir: dockerfilePath/dockerContext are both given relative to the repo root instead,
    # since Render resolves dockerContext relative to rootDir (when set) but dockerfilePath
    # relative to the repo root regardless — mixing the two caused a bad "backend/backend" path.
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    # No preDeployCommand: Render's free tier doesn't support it. Migrations instead run as part
    # of the container's own startup command (see backend/Dockerfile's CMD) — idempotent, so this
    # is safe to run on every boot, including every free-tier cold start after spin-down.
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: FRONTEND_ORIGIN
        sync: false # set to the deployed frontend URL, e.g. https://eduvillage.vercel.app
      - key: DATABASE_URL
        sync: false # Neon connection string (free 1GB tier), must include ?sslmode=require
      - key: TEACHER_INVITE_CODE
        sync: false
      - key: ADMIN_USERNAME
        sync: false # set in the Render dashboard, never in this file
      - key: ADMIN_PASSWORD
        sync: false # set in the Render dashboard, never in this file
      - key: STORAGE_BACKEND
        value: s3
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false # e.g. https://<accountid>.r2.cloudflarestorage.com
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false # a Groq API key (gsk_...) — real, verified working against openai/gpt-oss-120b
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: SPEECH_TO_TEXT_API_KEY
        sync: false # same Groq key as LLM_API_KEY — without the two vars below it silently falls
        # back to real OpenAI's endpoint/model defaults, which rejects a Groq key outright
      - key: SPEECH_TO_TEXT_MODEL
        value: whisper-large-v3-turbo
      - key: SPEECH_TO_TEXT_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false # password-reset OTP wording: "{{otp}} is your EduVillage password reset code"
      - key: EMAILJS_LOGIN_TEMPLATE_ID
        sync: false # optional: a separate template for the new-device-login-approval OTP (falls
        # back to EMAILJS_TEMPLATE_ID if left unset)
      - key: EMAILJS_REGISTRATION_TEMPLATE_ID
        sync: false # optional: a separate template ("Verify Your EduVillage Email Address") for
        # the registration email-verification OTP (falls back to EMAILJS_TEMPLATE_ID if unset)
      - key: EMAILJS_REGISTRATION_SERVICE_ID
        sync: false # optional: all three REGISTRATION_* vars together route registration OTP
        # through a wholly separate EmailJS account (free-tier template-count workaround)
      - key: EMAILJS_REGISTRATION_PUBLIC_KEY
        sync: false
      - key: EMAILJS_REGISTRATION_PRIVATE_KEY
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false # EmailJS dashboard: Account -> Security -> "Private Key"

# No separate worker service: Render's free tier has no free Background Worker plan.
# The API itself kicks off summary/transcription jobs via FastAPI BackgroundTasks on request,
# so the pipeline still runs end to end — the only thing lost without a standalone worker is
# automatic recovery of a job stuck mid-"processing" after a crash/restart, and retry of a
# transient failure until the next relevant request happens to re-trigger one. Run
# `python -m app.worker --once` manually (e.g. via Render's one-off Shell) if a job looks stuck.
