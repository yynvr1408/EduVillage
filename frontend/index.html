<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F5B57" />
    <meta name="description" content="LanternEd is an offline-first learning platform providing live classes, adaptive audio fallback, AI lecture summaries, and reliable offline assignment synchronization." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LanternEd" />
    <title>LanternEd - Offline-First Learning Platform</title>
    <!-- Inter & Noto Sans Telugu Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Shaves DNS+TLS off the very first API call on a slow connection. VITE_API_BASE_URL is
         baked in at build time (see .env.example); harmless if unset locally. -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F8FAF7] text-[#202B2A] antialiased selection:bg-[#DDF3EA] selection:text-[#0F5B57]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
